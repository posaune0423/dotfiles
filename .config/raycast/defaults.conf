# Raycast preferences stored in the com.raycast.macos defaults domain.
# Usage:
#   ./scripts/raycast-defaults.sh status
#   ./scripts/raycast-defaults.sh --dry-run apply
#   ./scripts/raycast-defaults.sh apply        # then restart Raycast
#   ./scripts/raycast-defaults.sh export-defaults ./.config/raycast/defaults.conf
#
# Format: <key> <type> <value>   (type: string | bool | int)
# Hotkeys use Raycast's own "<Modifiers>-<keycode>" form; 49 is Space.
# Everything else Raycast keeps (aliases, snippets, quicklinks, extension
# preferences) lives in its encrypted database and is covered by Cloud Sync.

raycastGlobalHotkey                  string  Control-49
raycastPreferredWindowMode           string  default
raycastShouldFollowSystemAppearance  bool    true
enforcedInputSourceIDOnOpen          string  com.google.inputmethod.Japanese
navigationCommandStyleIdentifierKey  string  vim
useHyperKeyIcon                      bool    false
emojiPicker_skinTone                 string  light
script-command-mode                  string  Compact
script-command-template              string  Bash
