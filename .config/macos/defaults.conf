# macOS system preferences this repository owns, written through defaults(1).
# Usage:
#   ./scripts/macos-defaults.sh status
#   ./scripts/macos-defaults.sh --dry-run apply
#   ./scripts/macos-defaults.sh apply        # then log out and back in
#   ./scripts/macos-defaults.sh export-defaults ./.config/macos/defaults.conf
#
# Format: <domain> <key> <type> <value>   (type: string | bool | int)
# Values must not contain whitespace.
#
# Key repeat is deliberately faster than System Settings allows: the Keyboard
# sliders bottom out at KeyRepeat 2 / InitialKeyRepeat 15, and both a macOS
# upgrade and a visit to that panel clamp the values back into slider range.
# Re-run `apply` after either.
#   KeyRepeat                x15ms repeat interval        (1  = 15ms)
#   InitialKeyRepeat         x15ms delay before repeating (10 = 150ms)
#   ApplePressAndHoldEnabled false keeps repeat instead of the accent popover

NSGlobalDomain  KeyRepeat                 int   1
NSGlobalDomain  InitialKeyRepeat          int   10
NSGlobalDomain  ApplePressAndHoldEnabled  bool  false
