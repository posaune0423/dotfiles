name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Format Check (make format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq

      - name: Install formatter and lint tools
        uses: taiki-e/install-action@v2
        with:
          tool: shfmt,shellcheck,stylua,taplo-cli

      - name: Run format check
        run: make format

  lint:
    name: Lint Check (make lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq

      - name: Install formatter and lint tools
        uses: taiki-e/install-action@v2
        with:
          tool: shfmt,shellcheck,stylua,taplo-cli

      - name: Run lint
        run: make lint

  verify:
    name: Behavior and privacy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh

      - name: Verify tracked Git config privacy
        run: sh scripts/verify_gitconfig_privacy.sh

      - name: Verify Fish tool routing
        run: fish scripts/verify_fish_tool_routing.fish

      - name: Verify Zsh mise routing
        run: sh scripts/verify_zsh_mise_path.sh
